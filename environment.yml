# Conda environment for the convergent-evolution genomics pipeline.
#
# Create:   conda env create -f environment.yml
# Activate: conda activate convgeno
# Update:   conda env update -f environment.yml --prune
#
# After activating, install the convgeno package in editable mode:
#   pip install -e Src/Reu/python/

name: convgeno
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python >=3.10,<3.13
  - biopython >=1.80
  - numpy >=1.24
  - pyyaml>=6.0
  - orthofinder=2.5.5
  - diamond=2.1.9
  - mcl
  - fasttree
  - fastme
  - mafft

  # --- R stack for the categorical phenotype tree (CAFE -y) step ---
  # All on conda-forge, so R lives IN this env (unlike r8s below): a single
  # `conda activate convgeno` then provides OrthoFinder AND the R phenotype-tree
  # step, so the automatic post-OrthoFinder step runs end-to-end with no extra
  # setup. See tools/r-deps/ for installing these into an external/module R
  # instead (e.g. local dev without conda).
  - r-base >=4.2
  - r-ape
  - r-castor
  - r-expm
  - r-yaml

  # --- testing & linting ---
  - pytest >=7.0
  - pytest-cov

  # --- pipeline tools (uncomment as needed) ---
  # - blast >=2.14
  # - hmmer >=3.3
  # - snakemake >=8.0

  # NOTE: r8s (ultrametric step) is NOT on conda — build it from source with
  #   ./tools/r8s/install_r8s.sh   (see tools/r8s/README.md)
  # CAFE-5 is likewise installed separately (see docs / tool_paths.yaml).

  # --- pip-only packages ---
  - pip
  - pip:
      - -e ./Src/Reu/python/