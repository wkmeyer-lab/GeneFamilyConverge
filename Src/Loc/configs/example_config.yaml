# Pipeline configuration
# Copy this to a new file for each analysis run.

project:
  name: example_run
  description: "Pilot run on VGP mammal subset"

inputs:
  proteome_dir: Data/raw/proteomes
  species_tree: Data/raw/trees/species_tree.nwk
  phenotype_table: Data/raw/phenotypes/phenotypes.tsv
  # Source format determines how FASTA headers are parsed.
  # Supported: ensembl (more will be added as needed)
  source_format: ensembl

outputs:
  interim_dir: Data/interim
  processed_dir: Data/processed
  log_dir: Data/logs
  manifest_dir: Data/manifests

isoform_filter:
  # Strategy for picking one protein per gene.
  strategy: longest

# OrthoFinder settings for gene family clustering
# These are set when running `convgeno orthofinder` commands
orthofinder:
  # Path to directory containing filtered proteome FASTA files
  input_dir: "/share/ceph/wym219group/shared/projects/GeneFamilyConverge/Data/interim/cleaned_proteomes"
  # Path where OrthoFinder writes its results
  output_dir: "/share/ceph/wym219group/shared/projects/GeneFamilyConverge/Data/processed/orthofinder"
  # Threads for DIAMOND/BLAST sequence search (-t flag)
  search_threads: 16
  # Threads for analysis steps like tree inference (-a flag)
  analysis_threads: 8
  # Sequence search program: "diamond" (fast, default) or "blast"
  sequence_search: "diamond"
  # Multiple sequence alignment: "mafft" (default) or "muscle"
  msa_program: "mafft"
  # Tree inference: "fasttree" (default), "raxml", "raxml-ng", "iqtree"
  tree_program: "fasttree"
  # Additional OrthoFinder flags (e.g., ["--fewer-files"] for large datasets)
  extra_args: []

# r8s: make the OrthoFinder species tree ultrametric (required before CAFE-5).
ultrametric:
  # nsites: "auto" derives the alignment column count from
  # MultipleSequenceAlignments/SpeciesTreeAlignment.fa (MSA mode), or set an int.
  nsites: auto
  # One or more fossil/literature calibrations. `taxa` are two tip labels
  # (proteome basenames) whose MRCA is calibrated. Use `age` for a fixed age
  # (Myr), or `min_age`/`max_age` for a window. Replace with YOUR taxa/ages.
  calibrations:
    - name: humancat
      taxa: [human, cat]
      age: 94
  # Penalized-likelihood smoothing for a single r8s fit (higher = closer to a
  # strict clock). This is the fast, scalable default.
  smoothing: 100
  # Cross-validate smoothing instead of the fixed value above. More rigorous but
  # re-optimizes the whole tree per terminal per smoothing value (~O(taxa)
  # slower) — only practical for small trees. Leave false for genome-scale trees.
  cross_validate: false
  # Where make_tree_ultrametric writes the dated tree (consumed by CAFE-5 prep).
  output: Data/interim/cafe_input/species_tree_ultrametric.nwk

# Categorical phenotype tree = the CAFE-5 "-y" (multi-lambda) tree: the same
# topology as the ultrametric species tree, but every branch is labelled with an
# integer naming its phenotype / rate class (tips from the phenotype table,
# internal branches from ancestral-state reconstruction). Built by
# Src/Loc/scripts/make_categorical_phenotype_tree.R.
phenotype_tree:
  enabled: true
  # Column in inputs.phenotype_table holding tip labels; MUST match the species
  # tree tips (the OrthoFinder proteome basenames).
  id_col: species
  # Column holding the raw phenotype label to reconstruct.
  pheno_col: phenotype
  # Ancestral-state reconstruction model: ER (equal rates), SYM (symmetric), or
  # ARD (all rates different).
  model: ER
  # Root-state prior passed to the reconstruction (auto | flat | empirical | ...).
  root_prior: auto
  # Optional: force EVERY internal branch to this category instead of inferring
  # ancestral states (tips keep their own category). Leave null for real ASR.
  anctrait: null
  # Optional label collapsing applied BEFORE reconstruction. Keep the class count
  # small so CAFE's multi-lambda estimation stays identifiable.
  #   substitutions: whole-label relabels, list of [from, to]
  #   merge_only:    only HYBRID labels containing BOTH tokens -> to, list of [a, b]
  merges:
    substitutions: []
    merge_only: []
  # Tips with no phenotype in the table:
  #   background = give them an extra class (keeps -t / -y / -i tips aligned)
  #   drop       = remove them (also writes a pruned -t; you must then subset the
  #                CAFE count matrix to the same tips)
  unclassified: background
  # Category label used for unclassified tips when unclassified: background.
  background_label: background
  # ASR engine: by default the step uses the VENDORED getAncLiks in
  # Src/Reu/r/anc_recon.R (deps: castor + expm; no RERconverge). Optionally set
  # this to the lab's RERConvergeFunctions.R to source that instead. Leave null
  # to use the vendored copy.
  rer_functions: null
  # Outputs (default under <outputs.interim_dir>/cafe_input).
  output: Data/interim/cafe_input/lambda_tree.nwk
  legend: Data/interim/cafe_input/lambda_legend.tsv

cafe:
  enabled: true
  # Number of discrete rate categories for gamma model
  n_gamma_cats: 5
  extra_args: ""
  # Optional: exclude families with >= this many copies in any species
  # (mirrors the CAFE-5 tutorial's size filter). Leave blank for no filter.
  max_family_size: null

runtime:
  # If true, overwrite existing intermediate outputs
  overwrite: false
