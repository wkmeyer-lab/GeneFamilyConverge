# Tool paths
# Swap this file when moving between local dev and HPC.
# On HPC you may need full paths or module-loaded commands.

# --- Local (Mac / Linux workstation) ---
orthofinder:
  command: orthofinder

# r8s makes the species tree ultrametric. It is NOT on conda/bioconda:
# build it from source with tools/r8s/install_r8s.sh (see tools/r8s/README.md),
# then either put it on PATH or set the absolute `command` here /
# in tool_paths.local.yaml.
r8s:
  command: r8s

cafe:
  command: cafe5

# --- HPC example (uncomment and adjust) ---
# orthofinder:
#   command: /share/apps/orthofinder/2.5.5/orthofinder
# r8s:
#   command: /share/apps/r8s/1.81/r8s
